[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cect-classification"
version = "0.1.0"
description = "Paired AP/PVP attention MIL classification and targeted NCCT slice matching"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "nibabel>=5.1",
  "torch>=2.1",
  "timm>=1.0",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "Pillow>=10",
  "tqdm>=4.65",
  "h5py>=3.8",
]
[project.optional-dependencies]
dev = ["pytest>=8"]
[project.scripts]
cectcls = "cectcls.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
